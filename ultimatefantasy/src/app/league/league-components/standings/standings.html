<div class="standings-container">
    <div class="header">
        <h1>Team</h1>
        <h1>Wins</h1>
        <h1>Losses</h1>
    </div>

    <div class="team-standings" *ngFor="let team of standings">
        <p>{{team.username}}</p>
        <p>Wins: {{team.wins}}</p>
        <p>Loses: {{team.losses}}</p>
    </div>
</div>
