<button *ngIf="!isSettingsOpen" class="settings-btn" (click)="toggleSettings()">League Settings</button>

<div class="popup" *ngIf="isSettingsOpen">
    <div class="popup-content">
        <div class="settings-header">
            <h2>League Settings</h2>
            <button class="close-button" (click)="toggleSettings()">X</button>
        </div>

        <div class="setting-section">
            <h3>Draft Settings</h3>

            <div class="form-group">
                <select [(ngModel)]="newDraftSetting">
                    <option value="" disabled selected>Select Draft Type</option>
                    <option *ngFor="let setting of draftSettings" [value]="setting">{{ setting }}</option>
                </select>
                <button (click)="updateDraftSettings(newDraftSetting)">Save</button>
            </div>

        </div>

        <div>
            <h3>Set Roster Limit</h3>
            <div class="form-group">
                <input type="number" [(ngModel)]="rosterLimit" placeholder="Enter roster limit" />
                <button (click)="updateRosterLimit(rosterLimit)">Save</button>
            </div>

        </div>

        <div>
            <h3>Set Protection Limit</h3>
            <div class="form-group">
                <input type="number" [(ngModel)]="protectionLimit" placeholder="Enter protection limit" />
                <button (click)="updateProtectionLimit(protectionLimit)">Save</button>
            </div>

        </div>

        <div class="setting-section">
            <h3>Reset League</h3>
            <div class="form-group">
                <button (click)="resetLeague()">Reset League</button>
            </div>
        </div>


        <div class="setting-section">
            <h3>Delete League</h3>
            <div class="form-group">
                <button (click)="deleteLeague()">Delete League</button>
            </div>
        </div>

    </div>

</div>
